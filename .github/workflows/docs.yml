name: docs

on:
  push:
    branches: [ main, documentation ]
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to push to gh-pages
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install docs deps
        run: |
          python -m pip install -U pip
          pip install mkdocs mkdocs-material "mkdocstrings[python]" mkdocs-autorefs mkdocs-git-revision-date-plugin

      - name: Build & deploy to gh-pages
        run: mkdocs gh-deploy -f nrn_docs/nrn/mkdocs.yml --force