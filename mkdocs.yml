site_name: NRN
site_description: Neuro-Reasoning Network (NRN) — docs & API reference
# Fill these with your real values:
site_url: https://www.centaurinstitute.org/
repo_url: https://github.com/centaurinstitute/nrn
repo_name: centaurinstitute/nrn

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.top
    - content.code.copy
    - toc.integrate
    - search.suggest
    - search.highlight
  icon:
    repo: fontawesome/brands/github
  # Optional later:
  # logo: images/logo.png
  # favicon: images/favicon.png

plugins:
  - search
  - autorefs
  - git-revision-date
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            merge_init_into_class: true
            members_order: source
            separate_signature: true
            show_source: true
            show_root_toc_entry: false
            line_length: 88

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.snippets
  - pymdownx.emoji

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/install.md
      - Quickstart: getting-started/quickstart.md
  - API Reference:
      - RNRNClassifier: api/rnrnclassifier.md
  - Tutorials: tutorials/notebooks.md
  - Data Science:
      - Overview: ds/overview.md
      - Neural Reasoning Networks: ds/rn.md
      - Bandit Neural Reasoning Networks: ds/brn.md
      - Use Cases: ds/usecases.md